name: Daily Macroeconomic Nowcasting & Surveillance

on:
  schedule:
    # Runs everyday at 00:00 UTC (06:00 AM BST / Dhaka Time)
    - cron: '0 0 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub UI anytime

permissions:
  contents: write

jobs:
  run-nowcast:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy xgboost scikit-learn yfinance

      - name: Execute Daily Nowcasting Inference
        run: |
          python scripts/daily_realtime_nowcast_update.py

      - name: Commit and Push Updated Nowcast Log
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/processed/nowcast_log.csv nowcast_log.csv data/processed/latest_live_nowcast_bulletin.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore(auto): daily macroeconomic nowcast update [skip ci]" && git push)
